name: CI

# No pull_request trigger on purpose: the shared Forgejo runner gives job
# containers the host's rootless Docker socket, so only maintainer-controlled
# events (push to master or manual dispatch) may execute a workflow.
#
# Pushes build and test. Publishing lives in the tag-triggered workflows, so a
# normal commit never uploads a package.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  check:
    runs-on: docker
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Sync dependencies
        run: ~/.local/bin/uv sync --locked

      - name: Byte-compile the package
        run: ~/.local/bin/uv run python -m compileall -q src/wink

      - name: Import smoke test
        run: |
          ~/.local/bin/uv run python - <<'PY'
          import wink.train
          import wink.sample
          from wink.models import build_model, available_archs
          print("imports ok:", available_archs())
          PY

      - name: Tests
        run: ~/.local/bin/uv run pytest -q

      - name: Build the distributions
        run: ~/.local/bin/uv build

      - name: Check the package metadata
        run: ~/.local/bin/uvx twine check dist/*
