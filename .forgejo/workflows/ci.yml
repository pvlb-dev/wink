name: CI

# Deliberately no pull_request trigger: the runner hands every job the host
# Docker socket, so only maintainer-controlled events may execute a workflow.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  check:
    runs-on: docker
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
