name: CI

# No pull_request trigger: the shared runner hands every job the host Docker
# socket, so only maintainer-controlled events (push to master or manual
# dispatch) may execute a workflow. Run this manually against feat/<slug>
# before self-merging.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  check:
    runs-on: docker
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Sync dependencies
        run: ~/.local/bin/uv sync --locked

      - name: Byte-compile the package
        run: ~/.local/bin/uv run python -m compileall -q src/wink

      - name: Import smoke test
        run: |
          ~/.local/bin/uv run python - <<'PY'
          import wink.train
          import wink.sample
          from wink.models import build_model, available_archs
          print("imports ok:", available_archs())
          PY

      - name: Tests
        run: ~/.local/bin/uv run pytest -q
