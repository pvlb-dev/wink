name: Release notes

# Creates the Forgejo release for a v* tag from the matching CHANGELOG.md
# section and attaches the wheel + sdist. Runs independently of the publish
# jobs, so a release-page problem never blocks a package upload.
#
# Auth: the automatic Actions token has repository write for same-repository
# tag pushes; RELEASE_TOKEN overrides it when a dedicated identity is needed.
# Idempotent: an existing release for the tag is never rewritten.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: docker
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n1)"
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag does not match pyproject version v$version. Bump pyproject.toml or retag."
            exit 1
          fi

      - name: Build the distributions
        run: ~/.local/bin/uv build

      - name: Check the package metadata
        run: ~/.local/bin/uvx twine check dist/*

      - name: Extract release notes
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n1)"
          awk -v v="$version" \
            '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## / {exit} on {print}' \
            CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::No CHANGELOG.md section for $version; using a generic body."
            printf 'Release %s\n' "$version" > notes.md
          fi
          cat notes.md

      - name: Preview notes (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Manual run: build and notes check only; no release page created."

      - name: Create the Forgejo release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          set -eu
          token="${RELEASE_TOKEN:-${GITHUB_TOKEN:-${FORGEJO_TOKEN:-}}}"
          if [ -z "$token" ]; then
            echo "::warning::No release token available; skipping the release page."
            exit 0
          fi
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n1)"
          tag="v$version"
          auth="Authorization: token $token"

          status="$(curl -sS -o /dev/null -w '%{http_code}' -H "$auth" "$API/releases/tags/$tag")"
          if [ "$status" = "200" ]; then
            echo "Release $tag already exists; leaving its notes untouched."
            exit 0
          fi
          if [ "$status" != "404" ]; then
            echo "::error::Unexpected HTTP $status while looking for an existing release of $tag."
            exit 1
          fi

          VERSION="$version" NOTES="$(cat notes.md)" python3 -c 'import json,os; v=os.environ["VERSION"]; b=os.environ["NOTES"].strip(); open("release.json","w").write(json.dumps({"tag_name":f"v{v}","name":f"v{v}","body":b,"draft":False,"prerelease":"-" in v}))'


          id="$(curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" \
                 --data-binary @release.json "$API/releases" \
               | python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])')"
          echo "Created the release for $tag (id $id)."

          for asset in dist/*; do
            curl -fsS -o /dev/null -X POST -H "$auth" \
              -F "attachment=@$asset" "$API/releases/$id/assets?name=$(basename "$asset")"
            echo "Attached $asset."
          done
