# CIFAR-10 class-conditional, 10k-step RAT-32 run. WARNING: this currently
# crashes at ~4k steps because the bidirectional RAT window shrinks below the 64
# patch tokens as gamma decays. See issue #14. The 10k recovery run uses the
# hyper fallback in cifar10_hyper_10k.yaml. This is still a CPU run: expect color/texture structure, not
# ImageNet-style objects, and no FID claim until the 10k-sample eval exists.
device: auto
seed: 1337

model:
  arch: rat
  level: 1
  image_size: 32
  in_channels: 3
  patch_size: 4
  n_head: 32
  n_embd: 64
  n_layer: 4
  dropout: 0.0
  num_classes: 10
  time_conditioning: rotor
  pos_embed: learned2d

diffusion:
  timesteps: 200
  schedule: linear
  prediction: x0
  beta_start: 0.0001
  beta_end: 0.02
  sampler: ddim
  sampler_steps: 50
  eta: 0.0

trainer:
  batch_size: 64
  max_iters: 10000
  eval_interval: 1000
  eval_iters: 20
  learning_rate: 0.001
  weight_decay: 0.01
  seed: 1337
  gamma_max: 1.0
  checkpoint_dir: examples/saved/cifar10_rat_h32_10k
  save_interval: 2000
  sample_interval: 1000
  sample_count: 16
  torch_threads: 8
  ema_decay: 0.999

mlflow:
  experiment: wink-cifar10
  run_name: cifar10-rat-h32-x0-t200-10k
  tags:
    dataset: cifar10
    seed: "1337"
    seq_len: "64"
    timesteps: "200"
    budget: 10k
    ema: "0.999"
  tracking_uri: sqlite:///mlflow.db
  log_interval: 10
  system_metrics: false

data:
  name: cifar10
  root: examples/data
  download: true
