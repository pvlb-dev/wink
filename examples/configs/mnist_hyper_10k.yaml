# Extended epsilon-prediction run. The matched 3,000-step screen underfit:
# low-noise denoising worked (t=100 x0 MSE 0.04) but the high-noise model was
# too inaccurate for a 50-step DDIM chain. This run keeps the architecture and
# data exactly as mnist_hyper.yaml and only extends the training budget.
device: auto
seed: 1337

model:
  arch: hyper
  level: 1
  image_size: 28
  in_channels: 1
  patch_size: 4
  n_head: 4
  n_embd: 64
  n_layer: 4
  dropout: 0.0
  num_classes: 0
  time_conditioning: rotor
  pos_embed: learned2d

diffusion:
  timesteps: 1000
  schedule: linear
  prediction: epsilon
  beta_start: 0.0001
  beta_end: 0.02
  sampler: ddim
  sampler_steps: 50
  eta: 0.0

trainer:
  batch_size: 64
  max_iters: 10000
  eval_interval: 500
  eval_iters: 20
  learning_rate: 0.0002
  weight_decay: 0.01
  seed: 1337
  gamma_max: 1.0
  checkpoint_dir: examples/saved/mnist_hyper_10k
  save_interval: 1000
  sample_interval: 1000
  sample_count: 16
  torch_threads: 8

mlflow:
  experiment: wink-mnist
  run_name: hyper-l1-p4-d64-10k
  tags:
    dataset: mnist
    seed: "1337"
    seq_len: "49"
    budget: extended
  tracking_uri: sqlite:///mlflow.db
  log_interval: 10
  system_metrics: false

data:
  name: mnist
  root: examples/data
  download: true
