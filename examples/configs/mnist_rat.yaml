# M1 reference: RAT-16 on MNIST, 200 diffusion steps, 3k CPU steps.
# The simple unconditional training run; the promptable 0.1 config is
# mnist_rat_cond_cfg_h32_10k.yaml.
device: auto
seed: 1337

model:
  arch: rat
  level: 1
  image_size: 28
  in_channels: 1
  patch_size: 4
  n_head: 16
  n_embd: 64
  n_layer: 4
  dropout: 0.0
  num_classes: 0
  time_conditioning: rotor
  pos_embed: learned2d

diffusion:
  timesteps: 200
  schedule: linear
  prediction: x0
  beta_start: 0.0001
  beta_end: 0.02
  sampler: ddim
  sampler_steps: 50
  eta: 0.0

trainer:
  batch_size: 64
  max_iters: 3000
  eval_interval: 250
  eval_iters: 20
  learning_rate: 0.001
  weight_decay: 0.01
  seed: 1337
  gamma_max: 1.0
  checkpoint_dir: examples/saved/mnist_rat_h16
  save_interval: 500
  sample_interval: 500
  sample_count: 16
  torch_threads: 8
  ema_decay: 0.999

mlflow:
  experiment: wink-mnist
  run_name: rat-h16-x0-t200-ema
  tags:
    dataset: mnist
    seed: "1337"
    seq_len: "49"
    timesteps: "200"
    budget: rat-head-screen
    ema: "0.999"
  tracking_uri: sqlite:///mlflow.db
  log_interval: 10
  system_metrics: false

data:
  name: mnist
  root: examples/data
  download: true
