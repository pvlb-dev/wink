# Ablation: same model as mnist_hyper.yaml, v-prediction instead of epsilon.
# Created because epsilon-prediction samples were still noise at 3,000 steps;
# this run decides whether the target parameterisation is the bottleneck.
device: auto
seed: 1337

model:
  arch: hyper
  level: 1
  image_size: 28
  in_channels: 1
  patch_size: 4
  n_head: 4
  n_embd: 64
  n_layer: 4
  dropout: 0.0
  num_classes: 0
  time_conditioning: rotor
  pos_embed: learned2d

diffusion:
  timesteps: 1000
  schedule: linear
  prediction: v
  beta_start: 0.0001
  beta_end: 0.02
  sampler: ddim
  sampler_steps: 50
  eta: 0.0

trainer:
  batch_size: 64
  max_iters: 3000
  eval_interval: 250
  eval_iters: 20
  learning_rate: 0.0002
  weight_decay: 0.01
  seed: 1337
  gamma_max: 1.0
  checkpoint_dir: examples/saved/mnist_hyper_v
  save_interval: 500
  sample_interval: 500
  sample_count: 16
  torch_threads: 8

mlflow:
  experiment: wink-mnist
  run_name: hyper-v-l1-p4-d64
  tags:
    dataset: mnist
    seed: "1337"
    seq_len: "49"
    prediction: v
  tracking_uri: sqlite:///mlflow.db
  log_interval: 10
  system_metrics: false

data:
  name: mnist
  root: examples/data
  download: true
